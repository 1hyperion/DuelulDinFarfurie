<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Duelul din Farfurie - Jocuri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#fcded1;--panel:#f7cab7;--ink:#2b0d07;--red:#f04c33;--maroon:#6d0e00;--cell:#fff4ee;--line:#e9a58c;--display:'Lilita One','Arial Black',sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2a1410;--panel:#4a241b;--ink:#fde9e0;--red:#ff6b52;--maroon:#7a1a0a;--cell:#3a1c15;--line:#7a3d2f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;padding:32px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
h1{font-family:var(--display);font-weight:400;color:var(--red);font-size:clamp(2.4rem,9vw,5rem);line-height:.95;margin:0;text-align:center;text-transform:uppercase;text-wrap:balance}
.banner{background:var(--maroon);color:#fff;border-radius:999px;padding:8px 22px;text-align:center;font-size:clamp(.95rem,3vw,1.3rem)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;width:100%;max-width:820px}
a.card{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:4px solid var(--line);border-radius:22px;padding:24px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--red);outline:none}
.card .e{font-size:3rem;line-height:1}
.card h2{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;color:var(--red);text-transform:uppercase}
.card p{margin:0;font-size:1.05rem}
</style>
</head>
<body>
<h1>Duelul din farfurie</h1>
<div class="banner">Mănâncă isteț, crește măreț!</div>
<div class="cards">
  <a class="card" href="sortare.html"><span class="e" aria-hidden="true">🍎🍔</span><h2>Sănătos sau nesănătos?</h2><p>Trage fiecare aliment în coșul potrivit.</p></a>
  <a class="card" href="rebus.html"><span class="e" aria-hidden="true">🧩</span><h2>Rebus</h2><p>Ghicește fructele și legumele din ghicitori.</p></a>
</div>
</body>
</html>
