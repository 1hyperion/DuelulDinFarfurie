<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Duelul din Farfurie - Joc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: un singur ecran fara scroll; titlu, scor, tava cu alimente, doua cosuri una langa alta, mesaj jos */
:root{
  --bg:#fcded1; --panel:#f7cab7; --ink:#2b0d07; --red:#f04c33; --maroon:#6d0e00; --on-maroon:#ffffff;
  --good:#3f7a1a; --good-soft:#d9eab8; --bad:#c23a24; --bad-soft:#f8b8a8; --chip:#fff4ee; --line:#e9a58c;
  --display:'Lilita One','Arial Black',sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a1410; --panel:#4a241b; --ink:#fde9e0; --red:#ff6b52; --maroon:#7a1a0a; --on-maroon:#fff;
  --good:#9fd05a; --good-soft:#2f3f1a; --bad:#ff8a74; --bad-soft:#5a2218; --chip:#5c2e24; --line:#7a3d2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1410; --panel:#4a241b; --ink:#fde9e0; --red:#ff6b52; --maroon:#7a1a0a; --on-maroon:#fff;
  --good:#9fd05a; --good-soft:#2f3f1a; --bad:#ff8a74; --bad-soft:#5a2218; --chip:#5c2e24; --line:#7a3d2f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;padding-inline:16px;padding-block:10px;touch-action:manipulation;overflow:hidden}
main{max-width:980px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
h1{font-family:var(--display);font-weight:400;color:var(--red);font-size:clamp(1.5rem,5.5vh,2.6rem);line-height:1;margin:0;text-align:center;text-transform:uppercase;flex:none}
.banner{background:var(--maroon);color:var(--on-maroon);border-radius:999px;padding:5px 16px;text-align:center;font-size:clamp(.72rem,2vh,.95rem);flex:none}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
.score{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.score small{font-family:var(--body);font-size:.78rem;font-weight:800;opacity:.8}
button{font:inherit;font-weight:800;font-size:.85rem;border:0;border-radius:999px;padding:6px 16px;background:var(--red);color:#fff;cursor:pointer}
button:focus-visible,.food:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#tray{background:var(--panel);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;flex:1 1 0;min-height:0;overflow:hidden}
.food{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:3px 6px;width:clamp(64px,11vw,88px);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:clamp(.62rem,1.7vh,.76rem);font-weight:800;text-align:center;line-height:1.1}
.food .e{font-size:clamp(1.4rem,4.6vh,2rem);line-height:1.15}
.food.sel{border-color:var(--red);box-shadow:0 0 0 3px var(--red)}
.food.drag{position:fixed;z-index:50;pointer-events:none;cursor:grabbing;transform:scale(1.15) rotate(-4deg);box-shadow:0 10px 20px rgba(0,0,0,.3)}
.food.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1 1 0;min-height:0}
.bin{border-radius:16px;border:3px dashed;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0;overflow:hidden}
.bin h2{font-family:var(--display);font-weight:400;font-size:clamp(1.1rem,3vh,1.5rem);margin:0;display:flex;justify-content:space-between;gap:8px;text-transform:uppercase;line-height:1;flex:none}
.bin.good{background:var(--good-soft);border-color:var(--good)} .bin.good h2{color:var(--good)}
.bin.bad{background:var(--bad-soft);border-color:var(--bad)} .bin.bad h2{color:var(--bad)}
.bin.over{border-style:solid;filter:brightness(1.05)}
.bin ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;overflow:hidden}
.bin li{background:var(--chip);border-radius:999px;padding:2px 9px 2px 5px;font-size:.74rem;font-weight:800;display:flex;align-items:center;gap:4px}
.bin li span{font-size:1.15rem;line-height:1}
@media (max-width:560px){.bin li{padding:2px 4px}.bin li .n{display:none}.food{width:58px}}
#msg{background:var(--chip);border-radius:12px;padding:6px 12px;border:2px solid var(--line);font-size:clamp(.74rem,2vh,.92rem);flex:none;height:3.3em;overflow:hidden;display:flex;align-items:center}
#end{position:fixed;inset:0;z-index:80;background:rgba(40,8,2,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#end[hidden]{display:none}
#end .card{background:var(--maroon);color:var(--on-maroon);border-radius:22px;padding:24px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
#end h2{font-family:var(--display);font-weight:400;font-size:2.4rem;margin:0}
#end button{background:var(--on-maroon);color:var(--maroon);font-size:1rem;padding:10px 22px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
@media (prefers-reduced-motion:reduce){.food.shake{animation:none}}
</style>

</head>
<body>
<main>
  <h1>Duelul din farfurie</h1>
  <div class="banner">Trage alimentul în coșul potrivit sau atinge-l, apoi atinge coșul.</div>
  <div class="status">
    <div class="score" aria-live="polite"><span id="ok">0</span> / <span id="tot">16</span> <small>corecte · <span id="err">0</span> greșeli</small></div>
    <button id="reset" type="button">Joacă din nou</button>
  </div>
  <section id="tray" aria-label="Alimente de sortat"></section>
  <div class="bins">
    <section class="bin good" id="good" data-kind="good" aria-label="Coș mâncare sănătoasă"><h2>Sănătos <span id="cg">0</span></h2><ul></ul></section>
    <section class="bin bad" id="bad" data-kind="bad" aria-label="Coș mâncare nesănătoasă"><h2>Nesănătos <span id="cb">0</span></h2><ul></ul></section>
  </div>
  <div id="msg" role="status">Alege un aliment. Este sănătos sau nesănătos?</div>
</main>
<div id="end" hidden><div class="card"><h2>Bravo!</h2><p id="endtxt"></p><button id="again" type="button">Joacă din nou</button></div></div>
<canvas id="fx"></canvas>

<script>
const FOODS=[
['🍎','Măr','good','Merele dau fibre și vitamine.'],['🥕','Morcov','good','Morcovul are vitamina A, bună pentru ochi.'],
['🥦','Broccoli','good','Legumele verzi ne țin sănătoși.'],['🍌','Banană','good','Banana dă energie și potasiu.'],
['🐟','Pește','good','Peștele oferă proteine și grăsimi bune.'],['🥚','Ou','good','Oul are proteine pentru creștere.'],
['🥛','Lapte','good','Laptele dă calciu pentru oase.'],['💧','Apă','good','Apa e cea mai bună băutură.'],
['🍓','Căpșuni','good','Fructele sunt desertul sănătos.'],['🍅','Roșii','good','Roșiile au vitamina C.'],
['🥜','Nuci','good','Nucile au grăsimi bune pentru creier.'],['🍇','Struguri','good','Strugurii sunt dulci și plini de vitamine.'],
['🍝','Paste','good','Pastele integrale dau energie, în porții potrivite.'],['🍲','Supă','good','Supa de legume e ușoară și plină de vitamine.'],
['🍔','Burger','bad','Burgerul are multe grăsimi și sare.'],['🍟','Cartofi prăjiți','bad','Prăjelile au prea mult ulei.'],
['🥤','Coca-Cola','bad','O sticlă de cola are peste 10 lingurițe de zahăr.'],['🍕','Pizza','bad','Pizza are multe grăsimi și sare.'],
['🍩','Gogoașă','bad','Dulciurile sunt doar ocazionale.'],['🍫','Ciocolată','bad','Ciocolata cu lapte are mult zahăr.'],
['🍬','Bomboane','bad','Bomboanele strică dinții.'],['🌭','Hot dog','bad','Mezelurile procesate au mult sodiu.'],
['🍰','Prăjitură','bad','Prăjiturile au zahăr și grăsimi.'],['🍦','Înghețată','bad','Înghețata e un răsfăț, nu o masă.'],
['🧁','Brioșă','bad','Brioșele dulci au zahăr ascuns.']
];
const N=16, $=s=>document.querySelector(s);
const tray=$('#tray'), msg=$('#msg');
let ok, err, sel;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* confetti */
const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], raf=0;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',fit);fit();
function confetti(x,y,n,spread){
  if(reduce)return;
  const cols=['#f04c33','#fdc453','#568e22','#f7cab6','#ffffff','#e25134','#6d0e00'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(Math.random()*.6+.4)*spread;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  const k=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.012;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x*k,p.y*k);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w*k/2,-p.h*k/2,p.w*k,p.h*k);cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

function start(){
  ok=0;err=0;sel=null;
  tray.innerHTML='';$('#good ul').innerHTML='';$('#bad ul').innerHTML='';
  $('#cg').textContent=$('#cb').textContent='0';$('#end').hidden=true;
  const g=shuffle(FOODS.filter(f=>f[2]=='good')).slice(0,N/2), b=shuffle(FOODS.filter(f=>f[2]=='bad')).slice(0,N/2);
  shuffle(g.concat(b)).forEach(makeFood);
  upd();say('Alege un aliment. Este sănătos sau nesănătos?');
}
function upd(){$('#ok').textContent=ok;$('#err').textContent=err;$('#tot').textContent=N}
function say(t){msg.textContent=t}
function makeFood(f){
  const el=document.createElement('div');
  el.className='food';el.tabIndex=0;el.setAttribute('role','button');el.dataset.kind=f[2];el.dataset.tip=f[3];
  el.innerHTML='<span class="e" aria-hidden="true">'+f[0]+'</span>'+f[1];
  el._f=f;tray.appendChild(el);
  el.addEventListener('pointerdown',down);
  el.addEventListener('keydown',e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();pick(el)}});
}
function pick(el){
  if(sel)sel.classList.remove('sel');
  sel=(sel===el)?null:el;if(sel)sel.classList.add('sel');
  if(sel)say('Ai ales '+el._f[1]+'. Acum atinge coșul potrivit.');
}
function binAt(x,y){const e=document.elementFromPoint(x,y);return e&&e.closest('.bin')}
function drop(el,bin,x,y){
  if(!bin)return false;
  if(bin.dataset.kind==el.dataset.kind){
    const li=document.createElement('li');li.innerHTML='<span>'+el._f[0]+'</span><b class="n">'+el._f[1]+'</b>';li.title=el._f[1];
    bin.querySelector('ul').appendChild(li);el.remove();ok++;
    $(bin.id=='good'?'#cg':'#cb').textContent=bin.querySelectorAll('li').length;
    say('Corect! '+el.dataset.tip);upd();
    if(sel===el)sel=null;
    const r=bin.getBoundingClientRect();
    confetti(x??r.left+r.width/2,y??r.top+r.height/2,45,9);
    if(ok==N){
      $('#endtxt').textContent='Ai sortat toate alimentele cu '+err+' greșeli.';$('#end').hidden=false;
      confetti(innerWidth/2,innerHeight/3,140,14);setTimeout(()=>confetti(innerWidth/4,innerHeight/3,80,12),250);setTimeout(()=>confetti(innerWidth*.75,innerHeight/3,80,12),450);
    }
  }else{
    err++;upd();el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');
    say('Mai încearcă! '+el._f[1]+' nu merge aici. '+el.dataset.tip);
  }
  return true;
}
let drag=null;
function down(e){
  if(e.button>0)return;
  const el=e.currentTarget, r=el.getBoundingClientRect();
  drag={el,sx:e.clientX,sy:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,moved:false,r,ph:null};
  el.setPointerCapture(e.pointerId);
  el.onpointermove=move;el.onpointerup=up;el.onpointercancel=up;
}
function move(e){
  if(!drag)return;const el=drag.el;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
    drag.moved=true;
    const ph=document.createElement('div');ph.style.cssText='width:'+drag.r.width+'px;height:'+drag.r.height+'px';
    el.after(ph);drag.ph=ph;el.classList.add('drag');el.style.width=drag.r.width+'px';
  }
  el.style.left=(e.clientX-drag.dx)+'px';el.style.top=(e.clientY-drag.dy)+'px';
  document.querySelectorAll('.bin').forEach(b=>b.classList.remove('over'));
  const b=binAt(e.clientX,e.clientY);if(b)b.classList.add('over');
}
function up(e){
  if(!drag)return;const {el,moved,ph}=drag;drag=null;
  el.onpointermove=el.onpointerup=el.onpointercancel=null;
  document.querySelectorAll('.bin').forEach(b=>b.classList.remove('over'));
  if(!moved){pick(el);return}
  el.classList.remove('drag');el.style.left=el.style.top=el.style.width='';
  if(ph){ph.replaceWith(el)}
  if(e.type!='pointercancel')drop(el,binAt(e.clientX,e.clientY),e.clientX,e.clientY);
}
document.querySelectorAll('.bin').forEach(b=>b.addEventListener('click',e=>{if(sel){const el=sel;sel.classList.remove('sel');sel=null;drop(el,b,e.clientX,e.clientY)}}));
$('#reset').onclick=$('#again').onclick=start;
start();
</script>

</body>
</html>
